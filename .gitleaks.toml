title = "OrderLink Gitleaks Config"

[allowlist]
description = "Allowlist for OrderLink project"
files = [
    "(?i)package-lock\\.json",
    "(?i)yarn\\.lock",
    "(?i)pnpm-lock\\.yaml",
    "(?i)\\.env\\.example",
    "(?i)\\.gitignore"
]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
pattern = "(?i)(api[_-]?key|apikey|secret[_-]?key)[\"'\\s]*[:=][\"'\\s]*[a-zA-Z0-9_-]{20,}"
tags = ["key", "api"]

[[rules]]
id = "jwt-token"
description = "JWT Token"
pattern = "eyJ[A-Za-z0-9_-]*\\.[A-Za-z0-9_-]*\\.[A-Za-z0-9_-]*"
tags = ["jwt", "token"]

[[rules]]
id = "private-key"
description = "Private Key"
pattern = "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
tags = ["private-key", "ssh"]

[[rules]]
id = "mysql-connection-string"
description = "MySQL Connection String"
pattern = "mysql://[^\\s:]+:[^\\s@]+@[^\\s/]+/[^\\s]+"
tags = ["database", "mysql"]

[[rules]]
id = "generic-password"
description = "Generic Password in URL/Config"
pattern = "(?i)(password|passwd|pwd)[\"'\\s]*[:=][\"'\\s]*[^\"'\\s]{8,}"
tags = ["password"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
pattern = "AKIA[0-9A-Z]{16}"
tags = ["aws", "key"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
pattern = "(?i)aws[_-]?secret[_-]?access[_-]?key[\"'\\s]*[:=][\"'\\s]*[A-Za-z0-9/+=]{40}"
tags = ["aws", "secret"]

[[rules]]
id = "google-api-key"
description = "Google API Key"
pattern = "AIza[0-9A-Za-z\\-_]{35}"
tags = ["google", "api-key"]

[[rules]]
id = "slack-token"
description = "Slack Token"
pattern = "xox[baprs]-[0-9]{12}-[0-9]{12}-[0-9]{12}-[a-z0-9]{32}"
tags = ["slack", "token"]

[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
pattern = "ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}"
tags = ["github", "token"]

[[rules]]
id = "stripe-key"
description = "Stripe API Key"
pattern = "(sk|pk)_(live|test)_[0-9a-zA-Z]{24,}"
tags = ["stripe", "payment"]